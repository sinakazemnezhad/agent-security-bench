name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: List catalog
        run: asb list
      - name: Score sample submission
        run: |
          asb score \
            --task tasks/ml/01_train_loop_bug.json \
            --submission examples/submissions/01_train_loop_bug.py \
            --out /tmp/asb/t01.json
          asb score \
            --task tasks/ml/02_data_leakage.json \
            --submission examples/submissions/02_data_leakage.py \
            --out /tmp/asb/t02.json
      - name: Security suites
        run: |
          mkdir -p /tmp/asb
          asb security --suite security/suites/core_v1.json --agent-log examples/agent_logs/core_v1_clean.json --out /tmp/asb/s_core.json
          asb security --suite security/suites/extended_v1.json --agent-log examples/agent_logs/extended_v1_clean.json --out /tmp/asb/s_ext.json
          if asb security --suite security/suites/core_v1.json --agent-log examples/agent_logs/core_v1_failing.json --out /tmp/asb/s_fail.json; then
            echo "expected failing log to reject" >&2
            exit 1
          fi
      - name: Validate receipts
        run: |
          asb validate-receipt --receipt /tmp/asb/t01.json
          asb validate-receipt --receipt /tmp/asb/s_core.json
      - name: MCP fixture smoke
        run: |
          printf '%s\n' '{"id":1,"method":"tools/list"}' | python mcp/fixture_server.py | head -n 1 | grep list_dir
