name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync package data
        run: bash scripts/sync_package_data.sh
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Selftest
        run: asb selftest
      - name: List + catalog
        run: |
          asb list
          asb catalog --out /tmp/asb-catalog.json
      - name: Score + trace + leaderboard
        run: |
          mkdir -p /tmp/asb
          asb score --task tasks/ml/01_train_loop_bug.json --submission examples/submissions/01_train_loop_bug.py --out /tmp/asb/t01.json
          asb score --task tasks/ml/16_mcp_arg_allowlist.json --submission examples/submissions/16_mcp_arg_allowlist.py --out /tmp/asb/t16.json
          asb score-trace --suite security/suites/core_v1.json --trace examples/traces/mcp_session_pass.jsonl --out /tmp/asb/trace_pass.json
          if asb score-trace --suite security/suites/core_v1.json --trace examples/traces/mcp_session_fail.jsonl --out /tmp/asb/trace_fail.json; then
            echo "expected failing trace to reject" >&2
            exit 1
          fi
          asb leaderboard --agent-id gold --out-dir /tmp/asb/leaderboard
      - name: Security suites
        run: |
          asb security --suite security/suites/core_v1.json --agent-log examples/agent_logs/core_v1_clean.json --out /tmp/asb/s_core.json
          asb security --suite security/suites/extended_v1.json --agent-log examples/agent_logs/extended_v1_clean.json --out /tmp/asb/s_ext.json
          asb security --suite security/suites/production_v1.json --agent-log examples/agent_logs/production_v1_clean.json --out /tmp/asb/s_prod.json
          if asb security --suite security/suites/core_v1.json --agent-log examples/agent_logs/core_v1_failing.json --out /tmp/asb/s_fail.json; then
            echo "expected failing log to reject" >&2
            exit 1
          fi
          if asb security --suite security/suites/production_v1.json --agent-log examples/agent_logs/production_v1_failing.json --out /tmp/asb/s_prod_fail.json; then
            echo "expected production failing log to reject" >&2
            exit 1
          fi
      - name: Validate receipts
        run: |
          asb validate-receipt --receipt /tmp/asb/t01.json
          asb validate-receipt --receipt /tmp/asb/s_prod.json
          asb validate-receipt --receipt /tmp/asb/trace_pass.json
      - name: MCP fixture smoke
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | python mcp/fixture_server.py | head -n 1 | grep list_dir
          printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"read_file","arguments":{"path":"../etc/passwd"}}}' | python mcp/fixture_server.py | head -n 1 | grep -E 'escapes|error'
      - name: Upload leaderboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: asb-leaderboard-py${{ matrix.python-version }}
          path: /tmp/asb/leaderboard/leaderboard.json

  wheel-cold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync + build wheel
        run: |
          bash scripts/sync_package_data.sh
          pip install build
          python -m build
      - name: Cold install selftest
        run: |
          python -m venv /tmp/asb-cold
          /tmp/asb-cold/bin/pip install dist/*.whl
          cd /tmp
          /tmp/asb-cold/bin/asb selftest
          /tmp/asb-cold/bin/asb list | head
