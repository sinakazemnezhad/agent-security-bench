[project]
name = "agent-security-bench"
version = "0.4.0"
description = "Agent Security Evaluation Kit — score agent code and refuse unsafe tools, with receipts, AST checks, and live-trace adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sina Kazemnezhad", email = "operations@noetfield.com" }]
keywords = [
  "agent-security",
  "llm",
  "eval",
  "prompt-injection",
  "jailbreak",
  "mcp",
  "machine-learning",
  "receipts",
  "ssrf",
  "leaderboard",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/sinakazemnezhad/agent-security-bench"
Repository = "https://github.com/sinakazemnezhad/agent-security-bench"
Issues = "https://github.com/sinakazemnezhad/agent-security-bench/issues"
Related = "https://github.com/sinakazemnezhad/persian-llm-reference"
Changelog = "https://github.com/sinakazemnezhad/agent-security-bench/releases"

[project.scripts]
asb = "agent_security_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_security_bench = [
  "data/tasks/**/*.json",
  "data/security/**/*.json",
  "data/schema/**/*.json",
  "data/examples/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
